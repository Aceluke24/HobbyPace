<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — HobbyPace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6ECD9;
    --surface: #FFFFFF;
    --line: #E6D8BA;
    --ink: #33291D;
    --ink-dim: #7C6F55;
    --green: #5B8C6F;
    --green-dim: #DCEAE0;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height:1.55;
    -webkit-font-smoothing: antialiased;
  }
  .card{
    max-width: 480px;
    margin: 24px;
    text-align:center;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 56px 40px;
  }
  .badge{
    width:64px; height:64px;
    border-radius:50%;
    background: var(--green-dim);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 24px;
  }
  h1{ font-family: var(--serif); font-weight:600; font-size: 2rem; margin: 0 0 14px; }
  p{ color: var(--ink-dim); font-size: 1.05rem; margin: 0 0 28px; }
  a.back{
    display:inline-block;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration:none;
    font-weight: 500;
    transition: background 0.15s ease, color 0.15s ease;
  }
  a.back:hover{ background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="28" height="28" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="11.5" stroke="#5B8C6F" stroke-width="1.8"/>
        <path d="M8 13.5l3.3 3.3L18 9.5" stroke="#5B8C6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>You're on the list.</h1>
    <p>We'll email you the moment HobbyPace opens its doors — and you'll get early access before anyone else.</p>
    <a class="back" href="index.html">Back to the page</a>
  </div>
</body>
</html>
